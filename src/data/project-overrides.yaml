repo-doc-mcp-:
  featured: true
  category: personal
  displayName: "Repo Doc Generator"
  year: "2026"
  order: 3
  longDescription: >
    Engineers lose 30–60 minutes per branch writing documentation and
    context-switching between code and Confluence. I built a VS Code
    extension that reduces that to a single keyboard shortcut. It computes
    a three-dot diff against main, scans the repo for language and
    structural context, feeds everything to Claude, and produces two
    Confluence pages — one technical, one for PMs — in about 30 seconds.
    The extension auto-detects the branch, updates existing pages on
    re-runs, and handles Confluence auth and publishing end-to-end.
    Released on the VS Code Marketplace with zero external runtime
    dependencies.
  highlights:
    - "Built five-stage pipeline: diff detection → repo scan → AI generation → Confluence publish → page update"
    - "Dual-audience output — one technical doc for engineers, one summary for PMs, from a single run"
    - "Auto-publishes and updates Confluence pages, eliminating manual copy-paste workflow"
    - "Zero external runtime dependencies — pure TypeScript, no build-time frameworks"
  metrics:
    - { label: "Platform", value: "VS Code" }
    - { label: "AI", value: "Claude" }
    - { label: "Output", value: "2 docs / run" }

vansh482:
  featured: true
  category: personal
  displayName: "Terminal Profile"
  year: "2026"
  order: 4
  longDescription: >
    Most GitHub profile READMEs use JavaScript-rendered widgets or
    third-party badge services. I wanted something that ran entirely
    inside GitHub's SVG renderer — no external calls, no JS, no build
    step. The result is a fully animated terminal emulator and real-time
    telemetry banner composed entirely in SVG and SMIL. Every animation
    frame, cursor blink, and typing sequence is hand-authored markup.
    The constraint forced creative solutions: SMIL calcMode for easing,
    nested animate elements for sequencing, and careful viewBox math for
    responsive scaling.
  highlights:
    - "Animated terminal emulator rendered entirely in SVG/SMIL — zero JavaScript"
    - "Hand-authored frame-by-frame typing animation using nested SMIL animate elements"
    - "Runs inside GitHub's restricted SVG sandbox with no external service calls"
    - "Responsive scaling via viewBox math, works across all screen sizes"
  metrics:
    - { label: "Approach", value: "Zero-dep" }
    - { label: "Tech", value: "SVG + SMIL" }
    - { label: "JS Used", value: "None" }

portfolio-website:
  featured: false
  category: personal
  displayName: "This Portfolio"
  year: "2026"
  order: 5
  longDescription: >
    I rebuilt my portfolio from a single static HTML file into a
    multi-page Astro site that updates itself whenever I push code.
    GitHub webhooks trigger a rebuild, the build fetches fresh data from
    the GitHub API, and Astro generates static pages deployed to GitHub
    Pages. The homepage features an interactive 3D solar system built
    with React Three Fiber — planets are draggable with spring-back
    physics, and the scene switches between a solar system (light theme)
    and an Earth-Moon view (dark theme). A custom cursor with hover
    expansion, an event-log-style changelog, and view transitions round
    out the interactive experience.
  highlights:
    - "Webhook-triggered SSG — push to any repo and the portfolio rebuilds with fresh data in ~60 seconds"
    - "Interactive 3D solar system with draggable planets and spring-back physics (React Three Fiber)"
    - "Theme-aware 3D scene: solar system in light mode, Earth + Moon in dark mode"
    - "Event-log changelog auto-populated from GitHub Events API with type badges and commit SHAs"
  metrics:
    - { label: "Framework", value: "Astro" }
    - { label: "3D", value: "Three.js" }
    - { label: "Pages", value: "12" }

